title = "jonkeane の mokkō"
languageCode = "en-us"
copyright = "© Jonathan Keane"
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = "en"
enableRobotsTXT = true
timeZone = "America/Chicago"
baseURL = "https://mokkou.jonkeane.com"
disableAliases = true

[mediaTypes]
  [mediaTypes.'text/redirects']
    delimiter = ''

[outputFormats]
  [outputFormats.redirects]
    baseName = '_redirects'
    isPlainText = true
    mediaType = 'text/redirects'
    root = true

[params]
  title = "jonkeane の mokkō"
  description = "Woodorking projects"
  defaultTheme = "light"
  # path to the favicon folder, under "static"
  favicon = "favicons/"


[params.r2]
  blocked_tags = ["nogallery"]

[services]
  [services.googleAnalytics]
    ID = 'G-ZHQ3VFK5J4'

[params.author]
  name = "Jonathan Keane"

[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "redirects"]
  section = ["HTML"]

[imaging]
  resampleFilter = "CatmullRom"
  quality = 75
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription"

[module]
  [module.hugoVersion]
    extended = false
    min = "0.152.2"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"
  [[module.mounts]]
    source = "node_modules"
    target = "assets/node_modules"
  [[module.imports]]
    path = 'github.com/nicokaiser/hugo-theme-gallery'

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[menu]
[[menu.footer]]
  name = "GitHub"
  url = "https://github.com/jonkeane/jonkeane-woodworking/"
  weight = 3
