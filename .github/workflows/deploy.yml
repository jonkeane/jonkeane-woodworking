name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        type: choice
        default: none
        options: [none, preview, production]
      clear_cache:
        description: Clear Flickr metadata and image cache
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: woodworking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy_target == 'production') && 'production' || format('preview-manual-{0}', github.run_number) }}
      url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Test importer
        run: go test ./cmd/flickrimport
      - name: Restore Flickr metadata and images
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clear_cache) && github.event.pull_request.head.repo.fork != true }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/flickr
            assets/flickr
          key: flickr-local-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flickr-local-v1-${{ runner.os }}-
      - name: Import Flickr photos
        if: github.event.pull_request.head.repo.fork != true
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_CONSUMER_KEY: ${{ secrets.FLICKR_CONSUMER_KEY }}
          FLICKR_CONSUMER_SECRET: ${{ secrets.FLICKR_CONSUMER_SECRET }}
          FLICKR_OAUTH_TOKEN: ${{ secrets.FLICKR_OAUTH_TOKEN }}
        run: |
          token_file="$RUNNER_TEMP/flickr_oauth_token"
          trap 'rm -f "$token_file"' EXIT
          if [ -n "$FLICKR_OAUTH_TOKEN" ]; then
            umask 077
            printf '%s' "$FLICKR_OAUTH_TOKEN" > "$token_file"
          fi
          go run ./cmd/flickrimport -tokenFile "$token_file"
      - name: Install site dependencies
        run: |
          hugo mod vendor
          npm ci
      - name: Verify static galleries with fixtures
        run: python3 scripts/test-gallery.py
      - name: Build site
        if: github.event.pull_request.head.repo.fork != true
        run: npm run build
      - name: Save Flickr metadata and images
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/cache/save@v4
        with:
          path: |
            data/flickr
            assets/flickr
          key: flickr-local-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to Netlify
        id: deploy
        if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name != 'workflow_dispatch' || inputs.deploy_target != 'none') }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_PRODUCTION: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy_target == 'production' }}
          DEPLOY_ALIAS: ${{ github.event_name == 'pull_request' && format('PR{0}', github.event.pull_request.number) || format('manual-{0}', github.run_number) }}
        run: |
          if [ "$DEPLOY_PRODUCTION" = 'true' ]; then
            npx --yes netlify-cli deploy --prod --no-build --dir=public --json > "$RUNNER_TEMP/netlify-deploy.json"
          else
            npx --yes netlify-cli deploy --alias="$DEPLOY_ALIAS" --no-build --dir=public --json > "$RUNNER_TEMP/netlify-deploy.json"
          fi
          deploy_url="$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!data.deploy_url) process.exit(1); process.stdout.write(data.deploy_url)' "$RUNNER_TEMP/netlify-deploy.json")"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          {
            echo '### Netlify deployment'
            echo
            echo "[Open deployed site]($deploy_url)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\n## 🚀 Preview deployment\n\n[Open preview](${process.env.DEPLOY_URL})\n\nBuilt from ${context.sha.slice(0, 7)}.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
