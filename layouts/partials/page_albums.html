<div class="mb-12 mt-9 grid grid-cols-1 gap-6 px-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 3xl:grid-cols-5">
  {{ range where .Pages.ByDate.Reverse "Params.private" "ne" true }}
    {{ if .Params.r2_gallery_id }}
      {{ $cover := partial "r2/cover.html" . }}
      <a href="{{ .RelPermalink }}" class="rounded-2xl bg-neutral-100 transition-[filter] hover:brightness-90 dark:bg-neutral-800 dark:hover:brightness-110" title="{{ .Title }}">
        <div class="h-100" id="gallery-containers">
          <div class="w-full overflow-hidden rounded-2xl">
            <picture>
              <source srcset="{{ $cover.thumbnail }} {{ $cover.thumbnailWidth }}w,
                              {{ $cover.gallery }} {{ $cover.galleryWidth }}w,
                              {{ $cover.source }} {{ $cover.width }}w"
                      sizes="(min-width: 1536px) 20vw, (min-width: 1024px) 25vw, (min-width: 640px) 50vw, 100vw" />
              <img class="lazyload w-full" src="{{ $cover.gallery }}" width="{{ $cover.galleryWidth }}" height="{{ $cover.galleryHeight }}" alt="{{ $cover.alt }}" loading="lazy" decoding="async" />
            </picture>
          </div>
          <div class="p-5">
            <h5 class="mb-2 text-lg font-semibold leading-6">
              {{ .Title }}
            </h5>
          </div>
        </div>
      </a>
    {{ end }}
  {{ end }}
</div>
